map $uri $route_cache_control {
    default "no-store";
    ~^/assets/ "public, max-age=31536000, immutable";
}

map "$status:$route_cache_control" $response_cache_control {
    default $route_cache_control;
    ~^[45] "no-store";
}

server {
    listen 80;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;
    client_max_body_size 25m;

    add_header X-Content-Type-Options nosniff always;
    add_header X-Frame-Options DENY always;
    add_header Referrer-Policy same-origin always;
    add_header Cache-Control $response_cache_control always;

    location /api/ {
        proxy_pass http://api:8000;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        # 覆盖外部转发头，仅将直接客户端 IP 提供给私有网络中的 API。
        proxy_set_header X-Forwarded-For $remote_addr;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header Connection "";
        proxy_buffering off;
        proxy_cache off;
        proxy_read_timeout 180s;
    }

    # Only navigation may fall back to the SPA shell. Missing JS/CSS must stay 404.
    location /assets/ { try_files $uri =404; }
    location = /index.html { try_files $uri =404; }
    location / { try_files $uri $uri/ /index.html; }
}
